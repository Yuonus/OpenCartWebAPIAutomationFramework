name: Playwright Tests

on:
  # schedule:
  #   - cron: '0 1 * * 2-6'  # Mon-Fri 8:00 PM EST (during standard time)
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - stage
          - dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'QA' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # reportingLabs run history: powers the Trend chart, new vs known
      # failures, flaky dots and "got slower". One history per environment. will enable the reporting labs when use it
      # - name: Restore reportingLabs history
      #   uses: actions/cache@v4
      #   with:
      #     path: reporting-labs.history.json
      #     key: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-${{ github.run_id }}
      #     restore-keys: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-

      - name: Run tests
        run: npx playwright test --project=chromium
        env:
          ENV: ${{ github.event.inputs.environment || 'QA' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_id }}
          path: reports/html-report/
          retention-days: 30

      # - name: Generate Allure HTML Report
      #   if: always()
      #   run: |
      #     npm install -g allure-commandline
      #     allure generate allure-results --clean -o allure-report

      # - name: Upload Allure HTML Report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: allure-html-report-${{ github.run_id }}
      #     path: allure-report/
      #     retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 30

# Will enable the reporting lab configuration when starting using it
      # - name: Upload reportingLabs Report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: reporting-labs-report-${{ github.run_id }}
      #     path: reporting-labs/
      #     retention-days: 30